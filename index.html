<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0e">
<!-- Blindaje de color: la app trae SUS dos temas. color-scheme le dice al
     navegador cuál está activo (evita el Auto Dark de Chrome repintando
     encima) y darkreader-lock le pide a Dark Reader que no la reprocese —
     los colores lavados/verdosos que vimos venían de ahí, no de los tokens. -->
<meta name="color-scheme" content="dark light">
<meta name="darkreader-lock">
<title>RODEO — tu inglés 24/7</title>
<!-- PWA: app instalable + offline. El service worker se registra en el cutover
     (F7); mientras tanto las previews van sin SW para no cachear a medias. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RODEO">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Libre Baskerville, la letra del LIBRO. Se precarga desde el HTML y no
     desde libro.css porque ahí llega tarde: la @font-face vive en el CSS de la
     vista, que es lazy, así que la fuente empezaba a bajar cuando el lector ya
     estaba montado — y la primera página se pintaba en Georgia y cambiaba sola
     a media lectura (reporte de Gus, y solo en Verne, el libro que se abre
     primero: para cuando se llega a Alicia ya está en caché).
     Los tres pesos son archivos DISTINTOS de Fontsource: los tres se precargan
     porque las tres caras se usan en la primera pantalla del libro (cuerpo
     regular, títulos en negrita, subtítulo en cursiva).
     `crossorigin` es OBLIGATORIO aunque el archivo sea del mismo origen: las
     fuentes se piden en modo CORS, y sin el atributo el navegador descarga el
     archivo DOS veces y el preload no sirve de nada. -->
<link rel="preload" href="/fonts/LibreBaskerville-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/LibreBaskerville-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/LibreBaskerville-Italic.woff2" as="font" type="font/woff2" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>
/* Nivel, leído ANTES del primer paint: el principiante (A1) no tiene tab bar,
   y sin esto la vería aparecer y desaparecer en cada carga. Va en <html>
   porque <body> todavía no existe. Si algo falla, sin clase = avanzado = el
   comportamiento de siempre. */
try {
  if (JSON.parse(localStorage.getItem('rodeo_nivel') || 'null') === 'a1') {
    document.documentElement.classList.add('nivel-a1');
  }
  // Tema: sin elección guardada el default es GRADIENTE (pedido de Gus). Como
  // gradiente = shell oscuro + fondo animado que monta React tras hidratar,
  // aquí solo 'claro' pinta data-theme='light'; oscuro/gradiente/none dejan el
  // shell oscuro. Así no hay fogonazo blanco antes del primer paint.
  if (JSON.parse(localStorage.getItem('rodeo_tema') || 'null') === 'claro') {
    document.documentElement.setAttribute('data-theme', 'light');
  }
} catch (e) {}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
