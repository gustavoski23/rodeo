<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0e">
<title>RODEO — tu inglés 24/7</title>
<!-- PWA: app instalable + offline. El service worker se registra en el cutover
     (F7); mientras tanto las previews van sin SW para no cachear a medias. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RODEO">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@600;700;800;900&family=Space+Mono:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<script>
/* Nivel, leído ANTES del primer paint: el principiante (A1) no tiene tab bar,
   y sin esto la vería aparecer y desaparecer en cada carga. Va en <html>
   porque <body> todavía no existe. Si algo falla, sin clase = avanzado = el
   comportamiento de siempre. */
try {
  if (JSON.parse(localStorage.getItem('rodeo_nivel') || 'null') === 'a1') {
    document.documentElement.classList.add('nivel-a1');
  }
  // Tema: si no hay elección guardada se respeta la del sistema. Va aquí y no
  // en el script principal porque un cambio de fondo después del primer paint
  // es un fogonazo blanco (o negro) en la cara.
  var t = JSON.parse(localStorage.getItem('rodeo_tema') || 'null');
  if (t !== 'claro' && t !== 'oscuro') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
  }
  if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
} catch (e) {}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
