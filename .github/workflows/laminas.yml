# Trae las láminas del libro y las deja como WebP en public/libro/.
#
# POR QUÉ EN CI: las láminas se pintan en Canva y sus URLs de export son
# firmadas y de vida corta. Los runners de GitHub Actions sí tienen salida a
# internet abierta (a diferencia del entorno remoto donde se arma el
# manifiesto), así que este job hace la parte mecánica —bajar, recortar,
# comprimir y commitear— con la misma receta que correría en local
# (scripts/convertir-laminas.mjs).
#
# TEMPORAL: este workflow y scripts/laminas.json se borran cuando las láminas
# ya están en el repo. No son parte del build de la app.
name: Traer láminas

on:
  push:
    paths:
      - 'scripts/laminas.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # sharp es dependencia de UNA SOLA VEZ: se instala aquí y nunca entra al
      # package.json del proyecto.
      - run: npm install --no-save sharp

      - run: node scripts/convertir-laminas.mjs scripts/laminas.json

      - name: Commitear las láminas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/libro/
          if git diff --staged --quiet; then
            echo "sin cambios en las láminas"
          else
            git commit -m "chore(libro): láminas convertidas a WebP desde Canva"
            git push origin HEAD:${{ github.ref_name }}
          fi
